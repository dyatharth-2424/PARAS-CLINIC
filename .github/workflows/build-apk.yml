name: Build PARAS CLINIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Extract PARAS CLINIC project
        run: |
          unzip -q PARAS_CLINIC_GitHubReady.zip -d extracted
          echo "Project extracted"
          ls -la extracted/PARAS_CLINIC_GitHubReady

      - name: Build APK
        working-directory: extracted/PARAS_CLINIC_GitHubReady
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PARAS-CLINIC-APK
          path: extracted/PARAS_CLINIC_GitHubReady/app/build/outputs/apk/debug/*.apk
